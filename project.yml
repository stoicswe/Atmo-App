name: Atmo
options:
  bundleIdPrefix: stoicswe
  # Keeps LastUpgradeCheck current so Xcode stops offering "update to
  # recommended settings" on every open.
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.2"
    macOS: "26.2"
    watchOS: "26.2"

# Loose project files (no target membership). The StoreKit configuration
# must live in the project so the scheme's StoreKit setting can find it.
fileGroups:
  - Atmo.storekit

settings:
  base:
    DEVELOPMENT_TEAM: P22P7U46RW
    CODE_SIGN_STYLE: Automatic
    # Swift 5 language mode with Xcode's "approachable concurrency" profile
    # and main-actor-by-default isolation — the app target is almost
    # entirely UI. AtmoCore builds in strict Swift 6 mode independently.
    SWIFT_VERSION: "5.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Date-serial build number (YYYY.MMDD.HHMM): always ascending, no
    # state to track across machines. Stamp a fresh one before each
    # archive with Scripts/set-build-number.sh (it rewrites this line and
    # regenerates the project). Applies to every target — app, watch app,
    # and widget extension all inherit it, keeping their CFBundleVersions
    # matched (App Store validation requires it).
    CURRENT_PROJECT_VERSION: "2026.0901.1548"
    MARKETING_VERSION: "1.0.0"

packages:
  # Platform-neutral model/service layer (models, ATProtoService, stores,
  # view models). Lives in-repo so the Linux front end (LinuxApp/) shares
  # it; nothing in it may import SwiftUI, AppKit, UIKit, or WatchKit.
  AtmoCore:
    path: AtmoCore
  # The AT Protocol / Bluesky API library. The app target references it
  # directly too (views render ATProtoKit lexicon types like facets and
  # embeds); SPM resolves it to the same version AtmoCore pins.
  ATProtoKit:
    url: https://github.com/MasterJ93/ATProtoKit.git
    from: 0.34.1
  # Fork override: project-level (root) declaration redirects the
  # "swift-log" identity — ATProtoKit's transitive dependency — to the
  # fork. Kept in sync with AtmoCore/Package.swift and LinuxApp.
  swift-log:
    url: https://github.com/stoicswe/swift-log.git
    branch: main

targets:
  # ── iPhone / iPad / Mac ────────────────────────────────────────────────
  Atmo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Apple
        excludes:
          - Watch/**
          # Widget-extension-only sources (the @main WidgetBundle would
          # clash with the app's). The shared Live Activity attributes
          # live in Apple/LiveActivity, compiled into both targets.
          - Widgets/**
      - path: Resources/Assets.xcassets
      # Icon Composer document — actool builds the Liquid Glass app icon
      # from it on iOS/macOS 26 (name pairs with
      # ASSETCATALOG_COMPILER_APPICON_NAME); the appiconset PNGs remain
      # the legacy/watch fallback.
      - path: Resources/AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: stoicswe.com-atmin-app
        PRODUCT_NAME: Atmo
        # macOS: the application-menu title is the bundle/binary name, so
        # the Mac app ships as "Atomic.app" and the menu reads "Atomic".
        # iOS keeps the Atmo binary with the "@omic" home-screen name.
        # The bundle identifier is explicit above and unaffected.
        "PRODUCT_NAME[sdk=macosx*]": Atomic
        "INFOPLIST_KEY_CFBundleDisplayName[sdk=macosx*]": Atomic
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Resources/Atmo.entitlements
        # Xcode-managed entitlements/sandbox shortcuts (carried over from
        # the previous project; they merge into the signed entitlements).
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: YES
        # Voice memos: the macOS sandbox needs the audio-input resource
        # access or AVAudioRecorder silently refuses to record.
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        ENABLE_USER_SELECTED_FILES: readonly
        REGISTER_APP_GROUPS: YES
        AUTOMATION_APPLE_EVENTS: NO
        ENABLE_PREVIEWS: YES
        # Info.plist: generated, merged with the checked-in fragment
        # (background modes for the future push/fetch work).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "@omic"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        # Export compliance, answered at build time: the app uses only
        # standard HTTPS/TLS (exempt), so TestFlight skips the "Missing
        # Compliance" hold and auto-distributes to internal testers.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Voice memos: the composer's mic button records audio clips that
        # are rendered into waveform videos.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "@omic uses the microphone to record voice memos you attach to posts."
        # In-app camera: the composer's camera button shoots photos and
        # videos straight into a post…
        INFOPLIST_KEY_NSCameraUsageDescription: "@omic uses the camera to shoot photos and videos you attach to posts."
        # …and each capture is also kept in the user's photo library.
        # Save-to-Photos from posts (image viewer / video player) uses the
        # same permission (add-only access; nothing is read back).
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "@omic saves photos and videos you shoot in the composer, and media you save from posts, to your photo library."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphoneos*]": YES
        "INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphonesimulator*]": YES
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphoneos*]": UIStatusBarStyleDefault
        "INFOPLIST_KEY_UIStatusBarStyle[sdk=iphonesimulator*]": UIStatusBarStyleDefault
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "@executable_path/../Frameworks"
    dependencies:
      - package: AtmoCore
      - package: ATProtoKit
      # Embed the watch app in the iPhone/iPad build ("Embed Watch
      # Content"), so installing Atmo also installs it on a paired
      # Apple Watch. iOS only — the macOS destination has no watch.
      - target: AtmoWatch
        destinationFilters: [iOS]
      # Widget extension hosting the post-publish Live Activity UI.
      # iOS only — macOS has no Live Activities.
      - target: AtmoWidgets
        destinationFilters: [iOS]

  # ── Widget Extension (iOS) ─────────────────────────────────────────────
  # Renders the post-publish Live Activity (Lock Screen + Dynamic Island).
  # The app starts and drives the activity (PostPublishBridge); this
  # target only draws it — it needs no AtmoCore dependency, just the
  # shared attributes type in Apple/LiveActivity.
  AtmoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apple/Widgets
      - path: Apple/LiveActivity
    info:
      path: Resources/AtmoWidgets-Info.plist
      properties:
        CFBundleDisplayName: "@omic"
        # Track the app's versioning — xcodegen's generated plist defaults
        # to literal "1.0"/"1", and App Store validation flags an appex
        # whose CFBundleShortVersionString differs from its host app
        # (ITMS-90473, Build 35).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: stoicswe.com-atmin-app.widgets
        PRODUCT_NAME: AtmoWidgets
        SKIP_INSTALL: YES
        # Same export-compliance answer as every other target in the app.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  # ── Apple Watch ────────────────────────────────────────────────────────
  # Companion watch app embedded in the iOS build (runs independently of
  # the phone too): a compact read-and-react client — timeline and
  # notifications on AtmoCore.
  AtmoWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apple/Watch
      # The platform adapter layer is shared with the iOS/macOS target;
      # watch-incompatible pieces (Spotlight) are #if-guarded inside it.
      - path: Apple/Platform
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: stoicswe.com-atmin-app.watchkitapp
        PRODUCT_NAME: AtmoWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Deliberately NO entitlements file. Sharing the iOS app's would
        # request iCloud KVS, and `$(CFBundleIdentifier)` expands per
        # target — the watch would get its OWN container
        # (…app.watchkitapp), so it could never share data with the phone
        # anyway, while forcing the iCloud capability onto the watch App
        # ID (which broke Xcode Cloud's export: automatic signing cannot
        # add capabilities to a registered bundle ID).
        #
        # To give the watch real iCloud sync later: enable iCloud on the
        # watchkitapp App ID in the Developer portal, add a watch-only
        # entitlements file, and HARDCODE the parent's container
        # ($(TeamIdentifierPrefix)stoicswe.com-atmin-app) rather than
        # inheriting $(CFBundleIdentifier).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "@omic"
        # Same export-compliance declaration as the iOS/macOS target —
        # the embedded watch app must answer it too or it re-triggers the
        # TestFlight compliance hold.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: stoicswe.com-atmin-app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: AtmoCore
      # ApplePlatform.swift constructs ATProtoKit's AppleSecureKeychain.
      - package: ATProtoKit

schemes:
  Atmo:
    build:
      targets:
        Atmo: all
    run:
      config: Debug
      # Local tip-jar testing: Run uses the test products in Atmo.storekit.
      # Archive/Release builds ignore this and talk to the real App Store.
      storeKitConfiguration: Atmo.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  AtmoWatch:
    build:
      targets:
        AtmoWatch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
